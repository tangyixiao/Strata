<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 700 250"><rect width="700" height="72" x="0" y="0" fill="#eaf1f9" stroke="#2f6fb3" rx="6"/><text x="10" y="18" fill="#2f6fb3" font-size="12" font-weight="700">GPU VRAM 12 GB · 672 GB/s</text><rect width="150" height="38" x="10" y="26" fill="#2f6fb3" rx="3"/><text x="85" y="42" fill="#fff" font-size="10" text-anchor="middle">dense weights ~3.3 GB</text><text x="85" y="56" fill="#fff" font-size="9" text-anchor="middle">mixers · GR · routers · head</text><rect width="330" height="38" x="166" y="26" fill="#6d9fd4" rx="3"/><text x="331" y="42" fill="#fff" font-size="10" text-anchor="middle">expert cache: everything left (~6 GB)</text><text x="331" y="56" fill="#fff" font-size="9" text-anchor="middle">~4,500 of 24,576 experts, adaptive</text><rect width="90" height="38" x="502" y="26" fill="#8fb6e0" rx="3"/><text x="547" y="42" fill="#fff" font-size="10" text-anchor="middle">MTP layer</text><text x="547" y="56" fill="#fff" font-size="9" text-anchor="middle">0.8 GB</text><rect width="94" height="38" x="598" y="26" fill="#b3cde9" rx="3"/><text x="645" y="42" fill="#1b1d21" font-size="10" text-anchor="middle">KV + state</text><text x="645" y="56" fill="#1b1d21" font-size="9" text-anchor="middle">0.3-3 GB</text><text x="350" y="88" fill="#5a606b" font-size="10" text-anchor="middle">PCIe 4.0 x16 · ~26 GB/s · experts by DMA (prompt, 20% of misses, cache swaps)</text><rect width="700" height="72" x="0" y="96" fill="#fbf0e6" stroke="#c7702a" rx="6"/><text x="10" y="114" fill="#c7702a" font-size="12" font-weight="700">System RAM 64 GB DDR5 · ~41-52 GB/s · 6 CPU cores (AVX-512)</text><rect width="440" height="38" x="10" y="122" fill="#c7702a" rx="3"/><text x="230" y="138" fill="#fff" font-size="10" text-anchor="middle">pinned expert arena: all 24,576 experts</text><text x="230" y="152" fill="#fff" font-size="9" text-anchor="middle">34 GB (Q2_0) · 35.5 GB (IQ2_XS) · 43 GB (IQ3_XXS); the CPU computes misses in place</text><rect width="236" height="38" x="456" y="122" fill="#e0a877" rx="3"/><text x="574" y="138" fill="#fff" font-size="10" text-anchor="middle">OS page cache: hot n-gram rows</text><text x="574" y="152" fill="#fff" font-size="9" text-anchor="middle">+ OS, embedding table, buffers</text><text x="350" y="184" fill="#5a606b" font-size="10" text-anchor="middle">NVMe · 16 row reads per token, issued a step ahead</text><rect width="700" height="54" x="0" y="192" fill="#f1f3e8" stroke="#6b7b3a" rx="6"/><text x="10" y="210" fill="#6b7b3a" font-size="12" font-weight="700">SSD</text><rect width="300" height="38" x="60" y="200" fill="#6b7b3a" rx="3"/><text x="210" y="223" fill="#fff" font-size="10" text-anchor="middle">GGUF shard 1 (37.6-47 GB): read once at start</text><rect width="326" height="38" x="366" y="200" fill="#95a15f" rx="3"/><text x="529" y="223" fill="#fff" font-size="10" text-anchor="middle">GGUF shard 2: n-gram table 28.8 GB, memory-mapped</text></svg>